<aside class="sidebar" [class.collapsed]="collapsed">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-icon">🏥</div>
    <div class="brand-text" *ngIf="!collapsed">
      <span class="brand-name">Hospital ERP</span>
      <span class="brand-sub">Management System</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [title]="collapsed ? item.label : ''"
          class="nav-link"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User info at bottom -->
  <div class="sidebar-footer">
    <div class="user-info" *ngIf="!collapsed">
      <div class="user-avatar">{{ username.charAt(0).toUpperCase() }}</div>
      <div class="user-details">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">{{ role }}</span>
      </div>
    </div>
    <div class="user-avatar small" *ngIf="collapsed">{{ username.charAt(0).toUpperCase() }}</div>

    <button class="logout-btn" (click)="logout()" [title]="collapsed ? 'Logout' : ''">
      <span>🚪</span>
      <span *ngIf="!collapsed">Logout</span>
    </button>
  </div>

</aside>
