<div
  class="layout"
  [class.sidebar-collapsed]="sidebarCollapsed">

  <!-- Sidebar -->
  <app-sidebar
    [collapsed]="sidebarCollapsed">
  </app-sidebar>



  <!-- Main Content -->
  <div class="layout-main">

    <!-- Navbar -->
    <app-navbar
      (toggleSidebar)="toggleSidebar()">
    </app-navbar>



    <!-- Routed Pages -->
    <main class="layout-content">

      <router-outlet></router-outlet>

    </main>
  </div>
</div>
