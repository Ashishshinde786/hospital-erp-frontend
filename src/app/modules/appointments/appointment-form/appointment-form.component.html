<div class="modal-overlay">
  <div class="modal modal-lg">

    <div class="modal-header">
      <h3>{{ isEdit ? '✏️ Edit Appointment' : '➕ Book Appointment' }}</h3>
      <button class="btn-icon" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="modal-body">

      <div class="alert alert-danger" *ngIf="error">⚠️ {{ error }}</div>

      <!-- Form renders IMMEDIATELY, no *ngIf blocking it -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="form-row">

          <div class="form-group">
            <label>Patient *</label>

            <!-- Shows shimmer while loading, real select after -->
            <div *ngIf="loadingData"
              style="height:38px;border-radius:6px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite">
            </div>

            <select *ngIf="!loadingData" class="form-control" formControlName="patientId">
              <option value="">Select Patient</option>
              <option *ngFor="let p of patients" [value]="p.id">
                {{ p.firstName }} {{ p.lastName }}
              </option>
            </select>
            <span class="error-text"
              *ngIf="form.get('patientId')?.touched && form.get('patientId')?.invalid">Required</span>
          </div>

          <div class="form-group">
            <label>Doctor *</label>

            <div *ngIf="loadingData"
              style="height:38px;border-radius:6px;background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.2s infinite">
            </div>

            <select *ngIf="!loadingData" class="form-control" formControlName="doctorId">
              <option value="">Select Doctor</option>
              <option *ngFor="let d of doctors" [value]="d.id">
                Dr. {{ d.firstName }} {{ d.lastName }} — {{ d.specialization }}
              </option>
            </select>
            <span class="error-text"
              *ngIf="form.get('doctorId')?.touched && form.get('doctorId')?.invalid">Required</span>
          </div>

        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date &amp; Time *</label>
            <input type="datetime-local" class="form-control" formControlName="appointmentDateTime" />
            <span class="error-text"
              *ngIf="form.get('appointmentDateTime')?.touched && form.get('appointmentDateTime')?.invalid">Required</span>
          </div>
          <div class="form-group" *ngIf="isEdit">
            <label>Status</label>
            <select class="form-control" formControlName="status">
              <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Reason for Visit</label>
          <input type="text" class="form-control" formControlName="reason"
            placeholder="e.g. Fever, Routine checkup, Follow-up..." />
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea class="form-control" formControlName="notes" rows="3"
            placeholder="Additional notes, instructions for patient..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading || loadingData">
            <span class="spinner" *ngIf="loading"></span>
            {{ loading ? 'Saving...' : (isEdit ? 'Update Appointment' : 'Book Appointment') }}
          </button>
        </div>

      </form>

    </div>
  </div>
</div>

<style>
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
</style>
