<!-- src/app/modules/appointments/appointment-form/appointment-form.component.html -->
<div class="modal-overlay">
  <div class="modal modal-lg">

    <div class="modal-header">
      <h3>{{ isEdit ? '✏️ Edit Appointment' : '➕ Book Appointment' }}</h3>
      <button class="btn-icon" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="modal-body">

      <div class="loading-container" *ngIf="loadingData">
        <div class="spinner spinner-primary"></div>
        <span>Loading patients and doctors...</span>
      </div>

      <div class="alert alert-danger" *ngIf="error">⚠️ {{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loadingData">

        <div class="form-row">
          <div class="form-group">
            <label>Patient *</label>
            <select class="form-control" formControlName="patientId">
              <option value="">Select Patient</option>
              <option *ngFor="let p of patients" [value]="p.id">
                {{ p.firstName }} {{ p.lastName }}
              </option>
            </select>
            <span class="error-text" *ngIf="form.get('patientId')?.touched && form.get('patientId')?.invalid">Required</span>
          </div>
          <div class="form-group">
            <label>Doctor *</label>
            <select class="form-control" formControlName="doctorId">
              <option value="">Select Doctor</option>
              <option *ngFor="let d of doctors" [value]="d.id">
                Dr. {{ d.firstName }} {{ d.lastName }} — {{ d.specialization }}
              </option>
            </select>
            <span class="error-text" *ngIf="form.get('doctorId')?.touched && form.get('doctorId')?.invalid">Required</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date & Time *</label>
            <input type="datetime-local" class="form-control" formControlName="appointmentDateTime" />
            <span class="error-text" *ngIf="form.get('appointmentDateTime')?.touched && form.get('appointmentDateTime')?.invalid">Required</span>
          </div>
          <div class="form-group" *ngIf="isEdit">
            <label>Status</label>
            <select class="form-control" formControlName="status">
              <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Reason for Visit</label>
          <input type="text" class="form-control" formControlName="reason"
            placeholder="e.g. Fever, Routine checkup, Follow-up..." />
        </div>

        <div class="form-group">
          <label>Notes</label>
          <textarea class="form-control" formControlName="notes" rows="3"
            placeholder="Additional notes, instructions for patient..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span class="spinner" *ngIf="loading"></span>
            {{ isEdit ? 'Update Appointment' : 'Book Appointment' }}
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
