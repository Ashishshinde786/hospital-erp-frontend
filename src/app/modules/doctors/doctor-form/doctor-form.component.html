<!-- src/app/modules/doctors/doctor-form/doctor-form.component.html -->
<div class="modal-overlay">
  <div class="modal modal-lg">

    <div class="modal-header">
      <h3>{{ isEdit ? '✏️ Edit Doctor' : '➕ Add New Doctor' }}</h3>
      <button class="btn-icon" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="alert alert-danger" *ngIf="error">⚠️ {{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">

        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" class="form-control" formControlName="firstName" placeholder="Rajesh" />
            <span class="error-text" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">Required</span>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" class="form-control" formControlName="lastName" placeholder="Sharma" />
            <span class="error-text" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">Required</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Specialization *</label>
            <select class="form-control" formControlName="specialization">
              <option value="">Select Specialization</option>
              <option *ngFor="let s of specializations" [value]="s">{{ s }}</option>
            </select>
            <span class="error-text" *ngIf="form.get('specialization')?.touched && form.get('specialization')?.invalid">Required</span>
          </div>
          <div class="form-group">
            <label>License Number *</label>
            <input type="text" class="form-control" formControlName="licenseNumber" placeholder="MED12345" />
            <span class="error-text" *ngIf="form.get('licenseNumber')?.touched && form.get('licenseNumber')?.invalid">Required</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="doctor@hospital.com" />
            <span class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Enter valid email</span>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="tel" class="form-control" formControlName="phone" placeholder="9876543210" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Qualification</label>
            <input type="text" class="form-control" formControlName="qualification" placeholder="MBBS, MD" />
          </div>
          <div class="form-group" style="justify-content:flex-end; padding-top:1.5rem;">
            <label class="toggle-label">
              <input type="checkbox" formControlName="available" />
              <span>Available for Appointments</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Bio / Profile</label>
          <textarea class="form-control" formControlName="bio" rows="3"
            placeholder="Short profile about the doctor, experience, specializations..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span class="spinner" *ngIf="loading"></span>
            {{ isEdit ? 'Update Doctor' : 'Save Doctor' }}
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
