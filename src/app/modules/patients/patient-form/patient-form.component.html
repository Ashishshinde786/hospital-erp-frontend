<!-- src/app/modules/patients/patient-form/patient-form.component.html -->
<div class="modal-overlay">
  <div class="modal modal-lg">

    <div class="modal-header">
      <h3>{{ isEdit ? '✏️ Edit Patient' : '➕ Add New Patient' }}</h3>
      <button class="btn-icon" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="modal-body">
      <div class="alert alert-danger" *ngIf="error">⚠️ {{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>First Name *</label>
            <input type="text" class="form-control" formControlName="firstName" placeholder="Ashish" />
            <span class="error-text" *ngIf="form.get('firstName')?.touched && form.get('firstName')?.invalid">Required</span>
          </div>
          <div class="form-group">
            <label>Last Name *</label>
            <input type="text" class="form-control" formControlName="lastName" placeholder="Shinde" />
            <span class="error-text" *ngIf="form.get('lastName')?.touched && form.get('lastName')?.invalid">Required</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" class="form-control" formControlName="dateOfBirth" />
            <span class="error-text" *ngIf="form.get('dateOfBirth')?.touched && form.get('dateOfBirth')?.invalid">Required</span>
          </div>
          <div class="form-group">
            <label>Gender</label>
            <select class="form-control" formControlName="gender">
              <option value="">Select Gender</option>
              <option *ngFor="let g of genderOptions" [value]="g">{{ g }}</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phone (10 digits)</label>
            <input type="tel" class="form-control" formControlName="phone" placeholder="9876543210" />
            <span class="error-text" *ngIf="form.get('phone')?.touched && form.get('phone')?.invalid">Enter valid 10-digit number</span>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" class="form-control" formControlName="email" placeholder="patient@email.com" />
            <span class="error-text" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Enter valid email</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Blood Group</label>
            <select class="form-control" formControlName="bloodGroup">
              <option value="">Select Blood Group</option>
              <option *ngFor="let bg of bloodGroups" [value]="bg">{{ bg }}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Address</label>
            <input type="text" class="form-control" formControlName="address" placeholder="Full address" />
          </div>
        </div>

        <div class="form-group">
          <label>Medical History / Allergies</label>
          <textarea class="form-control" formControlName="medicalHistory" rows="3"
            placeholder="e.g. Diabetic, Hypertension, allergic to Penicillin..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span class="spinner" *ngIf="loading"></span>
            {{ isEdit ? 'Update Patient' : 'Save Patient' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
